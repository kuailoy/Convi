[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convi-backend"
version = "0.1.0"
description = "Python learning engine for Convi"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
